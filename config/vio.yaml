# Rear-camera VIO run configuration.
# Command-line flags override the values in this file.

anchor:
  # Stationary tag36h11 anchor
  id: 0
  size_m: 0.100

frontend:
  max_corners_per_cam: 220
  min_track_len: 5

optimizer:
  max_iters: 20

  # Anchor corner reprojection noise. 0.05 keeps the continuity-selected
  # low-motion PnP branch; 0.30 selects the high-motion branch.
  anchor_sigma_px: 0.05
  klt_sigma_px: 0.40

  # Huber thresholds for the anchor and KLT residuals.
  anchor_huber_px: 10.0
  klt_huber_px: 2.5

  # Optional PnP branch-continuity prior; 0 disables each prior.
  init_prior_rot: 0.0
  init_prior_trans: 0.0
