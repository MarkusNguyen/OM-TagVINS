[project]
name = "om-tagvins"
version = "0.1.0"
description = "Rear-camera visual-inertial odometry with a stationary AprilTag anchor"
authors = [{ name = "MarkusNguyen", email = "11525061@student.vgu.edu.vn" }]
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "opencv-python>=4.8,<5",
    "pyyaml>=6.0,<7",
    "pandas>=2,<3",
    "rerun-sdk[catalog]>=0.37.2,<0.38",
    "pupil-apriltags>=1.0.4,<2",
    "telemetry-parser>=0.4",
]

[project.scripts]
om-tagvins = "trajectory:main"

# TEMPORARY: retained while tuning so `pixi run` can use the existing env.
# Remove before the final uv-only cleanup.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.24,<3"
scipy = ">=1.10,<2"
opencv = ">=4.8,<5"
pyyaml = ">=6.0,<7"
pandas = ">=2,<3"
gtsam = "==4.3.0"

[tool.pixi.tasks]
trajectory = "python -u trajectory.py"
converter = "python converter.py"
preprocess = "python preprocess.py"
optimize = "python optimize.py"
frontend = "python frontend.py"
rerun = "rerun"
